x-app-env: &app-env
  DB__NAME: skryzhal_db
  DB__USER: postgres
  DB__PASS: password
  DB__HOST: db
  DB__PORT: 5432
  S3_STORAGE__ENDPOINT_URL: http://localstack:4566
  S3_STORAGE__BUCKET: local-bucket
  S3_STORAGE__ACCESS_KEY: test
  S3_STORAGE__SECRET_KEY: test
  S3_STORAGE__REGION: us-east-1
  SQS__ENDPOINT_URL: http://localstack:4566
  SQS__QUEUE_NAME: skryzhal-render-queue
  SQS__DLQ_NAME: skryzhal-render-dlq
  SQS__ACCESS_KEY: test
  SQS__SECRET_KEY: test
  SQS__REGION: us-east-1

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: skryzhal_db
    volumes:
      - postgres_data:/var/lib/postgresql/
    ports:
      - 5432:5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d skryzhal_db" ]
      interval: 5s
      timeout: 5s
      retries: 3

  localstack:
    image: localstack/localstack:4
    environment:
      - SERVICES=s3,sqs
      - DEBUG=1
      - DISABLE_CORS_CHECKS=1
      - DATA_DIR=/var/lib/localstack/data
    ports:
      - "4566:4566"
    volumes:
      - ./localstack-init:/etc/localstack/init/ready.d
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4566/_localstack/health" ]
      interval: 5s
      timeout: 5s
      retries: 3

  api:
    build: .
    environment:
      <<: *app-env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_healthy

  worker:
    build: .
    command: python worker.py
    environment:
      <<: *app-env
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_healthy

volumes:
  postgres_data:
  localstack_data:
