services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: skryzhal_db
    volumes:
      - postgres_data:/var/lib/postgresql/
    ports:
      - 5432:5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d skryzhal_db" ]
      interval: 5s
      timeout: 5s
      retries: 3

  localstack:
    image: localstack/localstack:4
    environment:
      - SERVICES=s3,sqs
      - DEBUG=1
      - DISABLE_CORS_CHECKS=1
      - DATA_DIR=/var/lib/localstack/data
    ports:
      - "4566:4566"
    volumes:
      - ./localstack-init:/etc/localstack/init/ready.d
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4566/_localstack/health" ]
      interval: 5s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  localstack_data:
