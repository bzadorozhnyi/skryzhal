x-app-env: &app-env
  DB__NAME: skryzhal_db
  DB__USER: postgres
  DB__PASS: password
  DB__HOST: db
  DB__PORT: 5432
  S3_STORAGE__ENDPOINT_URL: http://localstack:4566
  S3_STORAGE__BUCKET: local-bucket
  S3_STORAGE__ACCESS_KEY: test
  S3_STORAGE__SECRET_KEY: test
  S3_STORAGE__REGION: us-east-1
  SQS__ENDPOINT_URL: http://localstack:4566
  SQS__QUEUE_NAME: skryzhal-render-queue
  SQS__DLQ_NAME: skryzhal-render-dlq
  SQS__ACCESS_KEY: test
  SQS__SECRET_KEY: test
  SQS__REGION: us-east-1

# Requires the Loki Docker logging driver plugin to be installed once on the
# host (Docker Desktop on macOS can't bind-mount the engine's internal log
# files, so this ships logs to Loki over HTTP instead of reading files):
#   docker plugin install grafana/loki-docker-driver:latest --alias loki --grant-all-permissions
x-loki-logging: &loki-logging
  driver: loki
  options:
    loki-url: "http://localhost:3100/loki/api/v1/push"
    loki-retries: "5"
    loki-batch-size: "400"

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: skryzhal_db
    volumes:
      - postgres_data:/var/lib/postgresql/
    ports:
      - 5432:5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d skryzhal_db" ]
      interval: 5s
      timeout: 5s
      retries: 3

  localstack:
    image: localstack/localstack:4
    environment:
      - SERVICES=s3,sqs
      - DEBUG=1
      - DISABLE_CORS_CHECKS=1
      - DATA_DIR=/var/lib/localstack/data
    ports:
      - "4566:4566"
    volumes:
      - ./localstack-init:/etc/localstack/init/ready.d
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4566/_localstack/health" ]
      interval: 5s
      timeout: 5s
      retries: 3

  api:
    build: .
    environment:
      <<: *app-env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_healthy
      loki:
        condition: service_started
    logging: *loki-logging
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          try:
              resp = urllib.request.urlopen("http://localhost:8000/ready", timeout=3)
              sys.exit(0 if resp.status == 200 else 1)
          except Exception:
              sys.exit(1)
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    build: .
    command: python worker.py
    environment:
      <<: *app-env
    ports:
      - "9101:9100"
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_healthy
      loki:
        condition: service_started
    logging: *loki-logging
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, pathlib, time
          p = pathlib.Path("/tmp/worker_heartbeat")
          sys.exit(0 if p.exists() and time.time() - p.stat().st_mtime < 60 else 1)
      interval: 15s
      timeout: 5s
      retries: 3

  relay:
    build: .
    command: python relay.py
    environment:
      <<: *app-env
    ports:
      - "9102:9100"
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_healthy
      loki:
        condition: service_started
    logging: *loki-logging
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, pathlib, time
          p = pathlib.Path("/tmp/relay_heartbeat")
          sys.exit(0 if p.exists() and time.time() - p.stat().st_mtime < 30 else 1)
      interval: 10s
      timeout: 5s
      retries: 3

  loki:
    image: grafana/loki:3.0.0
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./observability/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    depends_on:
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.27.0
    ports:
      - "9093:9093"
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml

  grafana:
    image: grafana/grafana:11.0.0
    ports:
      - "3001:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./observability/grafana-provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
      - prometheus

volumes:
  postgres_data:
  localstack_data:
  grafana_data:
  prometheus_data:
